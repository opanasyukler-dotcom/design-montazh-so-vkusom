<title>Карусель Anna Tvauri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;1,300&display=swap">
<style>
/* Layout: one Instagram-style post card, swipeable 4:5 carousel, dots + counter like the app */
:root{
  --bg:#0e1015; --card:#171a22; --line:#262a35; --fg:#f2eef0; --muted:#9a9fb0;
  --lilac:#fcd3ff; --powder:#e9cfc7;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-inline:16px;padding-block:24px 40px}
.post{max-width:540px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ava{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--powder);display:grid;place-items:center;color:var(--powder);font-size:15px}
.name{font-weight:600;font-size:14px}
.sub{font-size:12px;color:var(--muted)}
.viewport{position:relative;aspect-ratio:4/5;max-width:100%;background:#000}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px 9px;border-radius:12px;font-variant-numeric:tabular-nums}
.nav{position:absolute;top:50%;translate:0 -50%;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;font-size:18px;cursor:pointer;display:grid;place-items:center}
.nav:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.prev{left:10px}.next{right:10px}
.nav[disabled]{opacity:0;pointer-events:none}
.sound{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:14px;font:inherit;font-size:12px;padding:5px 10px}
.dots{display:flex;justify-content:center;gap:5px;padding:12px 0 4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--lilac)}
.cap{padding:8px 14px 16px;font-size:13px;line-height:1.5;color:var(--muted)}
.cap b{color:var(--fg);font-weight:600}
.hint{max-width:540px;margin:14px auto 0;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}}
</style>

<article class="post">
  <header class="head">
    <div class="ava" aria-hidden="true">A</div>
    <div><div class="name">anna.tvauri</div><div class="sub">Пластический хирург</div></div>
  </header>
  <div class="viewport">
    <div class="track" id="track"></div>
    <span class="count" id="count">1/11</span>
    <button class="nav prev" id="prev" aria-label="Предыдущий слайд">‹</button>
    <button class="nav next" id="next" aria-label="Следующий слайд">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <p class="cap"><b>anna.tvauri</b> Я вроде уже в форме. Почему тело всё равно не нравится? История комплексной коррекции груди и живота.</p>
</article>
<p class="hint">Листайте свайпом или стрелками. Видео в слайдах без звука, музыку добавляют при публикации.</p>

<script>
const S=["01_cover.mp4","02_before_arrows.jpg","03_why.mp4","04_bend.mp4","05_plan.jpg",
"06_surgery.mp4","07_transition.mp4","08_before_after_front.jpg","09_before_after_side.jpg","10_result.mp4","11_cta.jpg"];
const track=document.getElementById("track"),dots=document.getElementById("dots"),count=document.getElementById("count");
S.forEach((f,i)=>{
  const s=document.createElement("div");s.className="slide";
  if(f.endsWith(".mp4")){const v=document.createElement("video");v.src=f;v.muted=true;v.loop=true;v.playsInline=true;v.preload=i<2?"auto":"metadata";s.append(v)}
  else{const im=document.createElement("img");im.src=f;im.alt="Слайд "+(i+1);s.append(im)}
  track.append(s);
  const d=document.createElement("button");d.className="dot";d.setAttribute("aria-label","Слайд "+(i+1));d.onclick=()=>go(i);dots.append(d);
});
let cur=-1;
function go(i){track.scrollTo({left:i*track.clientWidth,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
function update(){
  const i=Math.round(track.scrollLeft/track.clientWidth);if(i===cur)return;cur=i;
  count.textContent=(i+1)+"/"+S.length;
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===S.length-1;
  track.querySelectorAll("video").forEach((v,k)=>{const own=v.parentElement===track.children[i];if(own){v.currentTime=0;v.play().catch(()=>{})}else v.pause()});
}
track.addEventListener("scroll",()=>requestAnimationFrame(update));
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
update();
</script>
